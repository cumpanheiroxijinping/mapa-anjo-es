<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soporte – Mapa del Ángel de la Guarda</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', sans-serif;
      color: #f4f1ea;
      background: #0b1020;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .bg {
      position: fixed; inset: 0; z-index: -1;
      background: radial-gradient(circle at 50% 30%, #2a2350 0%, #0b1020 70%);
    }
    .container { padding: 40px 24px; max-width: 640px; }
    h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(32px, 6vw, 52px);
      letter-spacing: 1px;
      margin-bottom: 18px;
      color: #f7e9c8;
    }
    p { font-size: 18px; line-height: 1.6; color: #cfd3e0; margin-bottom: 14px; }
    .mail {
      display: inline-block;
      margin: 28px 0 18px;
      padding: 16px 34px;
      font-size: 18px;
      font-weight: 700;
      color: #0b1020;
      background: linear-gradient(135deg, #f7e9c8, #e6c98f);
      border-radius: 8px;
      text-decoration: none;
      box-shadow: 0 6px 24px rgba(0,0,0,0.35);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .mail:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,0.45); }
    .back {
      display: inline-block;
      margin-top: 10px;
      color: #9aa3c0;
      text-decoration: underline;
      font-size: 15px;
    }
    .back:hover { color: #f4f1ea; }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="container">
    <h1>Soporte</h1>
    <p>¿Necesitas ayuda con tu Mapa del Ángel de la Guarda? Escríbenos y te
       responderemos lo antes posible.</p>
    <a class="mail" href="mailto:hola@mapa-del-angel.com">hola@mapa-del-angel.com</a>
    <br>
    <a class="back" href="/">Volver al inicio</a>
  </div>
</body>
</html>
